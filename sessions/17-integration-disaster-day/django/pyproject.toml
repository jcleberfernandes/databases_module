[project]
name = "s17-django"
version = "0.1.0"
description = "Session 17 in Django: integration, concurrency tests and disaster day"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "dj-database-url>=3.0",
    "psycopg[binary]>=3.3",
    "pymongo>=4.18",
    "redis>=8.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]
