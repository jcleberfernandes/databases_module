[project]
name = "s17-fastapi"
version = "0.1.0"
description = "Session 17 in FastAPI: integration and disaster day"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "pymongo>=4.18",
    "redis>=8.1",
    "pydantic>=2.12",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
]
