[project]
name = "s08-fastapi"
version = "0.1.0"
description = "Session 08 in FastAPI: transactions and concurrency"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "psycopg[binary]>=3.3",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]
